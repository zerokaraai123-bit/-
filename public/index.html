<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>顔シミュ - 髪型・髪色・印象チェンジ</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card2: #1f232c;
    --text: #f2f3f5;
    --muted: #9aa2af;
    --accent: #ff5c8a;
    --accent2: #7c8cff;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    padding: 20px 16px 8px;
    text-align: center;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  header p {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .upload-box {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .upload-box img {
    max-width: 100%;
    max-height: 260px;
    border-radius: 8px;
  }
  .upload-box .placeholder {
    color: var(--muted);
    font-size: 14px;
  }
  input[type=file] { display: none; }
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .mode-tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    background: var(--card2);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .mode-tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border-color: transparent;
  }
  .chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .chip {
    padding: 10px;
    border-radius: 10px;
    background: var(--card2);
    border: 1px solid var(--border);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
  }
  .chip.selected {
    border-color: var(--accent);
    background: rgba(255, 92, 138, 0.12);
    color: var(--accent);
    font-weight: 600;
  }
  textarea {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-size: 13px;
    resize: vertical;
    min-height: 44px;
  }
  .consent {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-top: 4px;
  }
  .consent input { margin-top: 3px; }
  button.primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
  }
  button.primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .result-img {
    width: 100%;
    border-radius: 12px;
    margin-top: 10px;
  }
  .status {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 18px;
  }
  .error {
    color: var(--accent);
  }
  .note {
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
    line-height: 1.6;
  }
  .download-btn {
    display: block;
    text-align: center;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    background: var(--card2);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<header>
  <h1>顔シミュ プロトタイプ</h1>
  <p>髪型・髪色・印象チェンジをAIで試着</p>
</header>

<main>
  <div class="card">
    <h2>1. 写真をアップロード</h2>
    <label class="upload-box" id="uploadBox">
      <span class="placeholder" id="uploadPlaceholder">正面から撮った、明るい写真がおすすめです<br>タップして選択</span>
      <img id="previewImg" style="display:none" />
      <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp" />
    </label>
  </div>

  <div class="card">
    <h2>2. モードを選ぶ</h2>
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="hairstyle">髪型</div>
      <div class="mode-tab" data-mode="haircolor">髪色</div>
      <div class="mode-tab" data-mode="impression">印象チェンジ</div>
    </div>
    <div id="chipContainer" class="chip-grid"></div>
    <textarea id="customPrompt" placeholder="自由入力(例: 明るめの栗色のミディアムボブ)。選ぶと上のプリセットより優先されます"></textarea>
  </div>

  <div class="card">
    <h2>3. 確認して実行</h2>
    <label class="consent">
      <input type="checkbox" id="consentCheck" />
      <span>
        この写真は加工のため外部の画像生成AIサービス(OpenAI)に送信されることに同意します。
        処理が完了次第、サーバー上の写真データは保持されません。
        整形シミュレーションではなく、髪型・髪色・軽い印象の変化のみを扱う機能であることを理解しました。
      </span>
    </label>
    <button class="primary" id="submitBtn" disabled>この内容でシミュレーションする</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>結果</h2>
    <img class="result-img" id="resultImg" />
    <a class="download-btn" id="downloadBtn" download="face-sim-result.png">画像を保存</a>
  </div>

  <p class="note">
    ※ 生成結果はAIによるイメージであり、実際の見た目や施術結果を保証するものではありません。<br>
    ※ 整形シミュレーションではなく、印象の軽い変化(眉・ヘアライン・メガネなど)のみを扱っています。
  </p>
</main>

<script>
const PRESET_LABELS = {
  hairstyle: {
    short_bob: 'ショートボブ',
    layered_medium: 'レイヤーミディアム',
    long_straight: 'ロングストレート',
    perm_curls: 'パーマ・カール',
    short_fade: 'ショートフェード(男性)',
    slick_back: 'オールバック(男性)',
  },
  haircolor: {
    black: '黒髪',
    dark_brown: 'ダークブラウン',
    ash_brown: 'アッシュブラウン',
    honey_blonde: 'ハニーブロンド',
    ash_gray: 'アッシュグレー',
    burgundy: 'バーガンディ',
  },
  impression: {
    softer_brows: '眉を柔らかい印象に',
    fuller_brows: '眉を太めに',
    clear_hairline: '生え際をすっきり',
    glasses_round: '丸メガネを着用',
    glasses_square: 'スクエアメガネを着用',
    fresh_skin: '肌をすこやかな印象に',
  },
};

let currentMode = 'hairstyle';
let selectedKey = null;
let selectedFile = null;

const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const previewImg = document.getElementById('previewImg');
const uploadPlaceholder = document.getElementById('uploadPlaceholder');
const chipContainer = document.getElementById('chipContainer');
const consentCheck = document.getElementById('consentCheck');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const resultCard = document.getElementById('resultCard');
const resultImg = document.getElementById('resultImg');
const downloadBtn = document.getElementById('downloadBtn');
const customPrompt = document.getElementById('customPrompt');

function renderChips() {
  chipContainer.innerHTML = '';
  selectedKey = null;
  const labels = PRESET_LABELS[currentMode];
  Object.entries(labels).forEach(([key, label]) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = label;
    chip.dataset.key = key;
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedKey = key;
      updateSubmitState();
    });
    chipContainer.appendChild(chip);
  });
}

document.querySelectorAll('.mode-tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach((t) => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    renderChips();
    updateSubmitState();
  });
});

uploadBox.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    previewImg.src = e.target.result;
    previewImg.style.display = 'block';
    uploadPlaceholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
  updateSubmitState();
});

consentCheck.addEventListener('change', updateSubmitState);
customPrompt.addEventListener('input', updateSubmitState);

function updateSubmitState() {
  const hasChoice = !!selectedKey || customPrompt.value.trim().length > 0;
  submitBtn.disabled = !(selectedFile && consentCheck.checked && hasChoice);
}

renderChips();

submitBtn.addEventListener('click', async () => {
  statusEl.textContent = '生成中です。10〜30秒ほどお待ちください…';
  statusEl.classList.remove('error');
  submitBtn.disabled = true;
  resultCard.style.display = 'none';

  const form = new FormData();
  form.append('photo', selectedFile);
  form.append('mode', currentMode);
  form.append('consent', 'true');
  if (customPrompt.value.trim()) {
    form.append('customPrompt', customPrompt.value.trim());
  }
  if (currentMode === 'hairstyle' && selectedKey) form.append('styleKey', selectedKey);
  if (currentMode === 'haircolor' && selectedKey) form.append('colorKey', selectedKey);
  if (currentMode === 'impression' && selectedKey) form.append('impressionKey', selectedKey);

  try {
    const res = await fetch('/api/edit', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '生成に失敗しました');

    resultImg.src = data.image;
    downloadBtn.href = data.image;
    resultCard.style.display = 'block';
    statusEl.textContent = '完了しました';
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
    statusEl.classList.add('error');
  } finally {
    updateSubmitState();
  }
});
</script>
</body>
</html>
